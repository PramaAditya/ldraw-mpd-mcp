name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build and run tests
        run: npm test

      - name: Verify CLI shebang, LF line endings, and npm package contents
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const cli = fs.readFileSync("dist/cli.js", "utf8");
            if (!cli.startsWith("#!/usr/bin/env node\n")) {
              throw new Error("dist/cli.js must start with LF shebang #!/usr/bin/env node\\n");
            }
          '
          node dist/cli.js --version
          node dist/cli.js --help >/dev/null
          PACK_JSON=$(npm pack --dry-run --json)
          node -e '
            const pkg = JSON.parse(process.argv[1])[0];
            const paths = pkg.files.map((f) => f.path);
            for (const required of ["dist/cli.js", "dist/index.js", "dist/index.d.ts", "skills/ldraw-mpd-maker/SKILL.md", "README.md", "LICENSE"]) {
              if (!paths.includes(required)) {
                throw new Error(`Missing required file in npm tarball: ${required}`);
              }
            }
            const leaked = paths.filter((p) => p.includes(".test."));
            if (leaked.length > 0) {
              throw new Error(`Test files leaked into npm tarball: ${leaked.join(", ")}`);
            }
            console.log(`npm pack verified: ${pkg.entryCount} files, ${pkg.size} bytes`);
          ' "$PACK_JSON"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high/critical)
        run: npm audit --audit-level=high
