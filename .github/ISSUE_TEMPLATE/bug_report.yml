name: Bug Report
description: Report a bug in ldraw-mpd-mcp (rendering, packing, setup, or MCP protocol)
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal `.ldr`/`.mpd` snippet or MCP tool call parameters.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Node.js version:
        - MCP client (Claude Desktop / Cursor / Claude Code / Antigravity):
        - Output of `npx ldraw-mpd-mcp doctor`:
    validations:
      required: true
