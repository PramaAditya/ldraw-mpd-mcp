name: Feature Request
description: Suggest a new MCP tool, renderer improvement, or LDraw workflow feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow or pain point does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API, CLI flag, or MCP tool behavior you'd like to see.
    validations:
      required: true
